  <g stroke="#FFFFFF" stroke-width="11" stroke-linecap="round">
    <line x1="100" y1="80" x2="82" y2="48"/>
    <line x1="156" y1="80" x2="174" y2="48"/>
  </g>
  <circle cx="82" cy="48" r="14" fill="#FFFFFF"/>
  <circle cx="174" cy="48" r="14" fill="#FFFFFF"/>

  <rect x="44" y="72" width="168" height="112" rx="48" fill="#FFFFFF"/>
  <circle cx="96" cy="130" r="18" fill="#6750A4"/>
  <circle cx="160" cy="130" r="18" fill="#6750A4"/>
</svg>
